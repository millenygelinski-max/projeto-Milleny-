
```html
<!-- ============================= -->
<!-- QUIZ DOS CAVALOS -->
<!-- ============================= -->

<section id="quiz" class="quiz-section">

    <div class="quiz-header">
        <span class="quiz-label">🎮 TESTE SEUS CONHECIMENTOS</span>

        <h2>Quiz dos Cavalos</h2>

        <p>
            Responda às perguntas e descubra quanto você aprendeu!
        </p>
    </div>

    <div id="quiz-container" class="quiz-container">

        <!-- Barra de progresso -->
        <div class="quiz-top">

            <span id="question-number">
                Pergunta 1 de 10
            </span>

            <span id="score">
                Pontuação: 0
            </span>

        </div>

        <!-- Barra -->
        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>

        <!-- Pergunta -->
        <h3 id="question">
            Qual raça é conhecida por sua famosa marcha?
        </h3>

        <!-- Alternativas -->
        <div id="answers" class="answers"></div>

        <!-- Mensagem -->
        <div id="feedback" class="feedback"></div>

        <!-- Botão próxima -->
        <button
            id="next-button"
            class="quiz-button"
            type="button"
            disabled
        >
            Próxima pergunta →
        </button>

    </div>


    <!-- RESULTADO -->

    <div id="quiz-result" class="quiz-result hidden">

        <div class="result-icon">
            🏆
        </div>

        <h2>Quiz concluído!</h2>

        <p class="result-text">
            Você acertou
            <strong id="final-score">0</strong>
            de
            <strong id="total-questions">10</strong>
            perguntas.
        </p>

        <h3 id="result-message">
            Muito bem!
        </h3>

        <button
            id="restart-button"
            class="quiz-button"
            type="button"
        >
            🔄 Jogar novamente
        </button>

    </div>

</section>
```
